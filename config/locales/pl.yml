        title: "Poznaj zasady meczu"
        body: "Otwórz Więcej opcji, aby zobaczyć liczbę legów i setów oraz zasady double-in i double-out. Możesz zostawić wartości domyślne."
        tip: "Dodatkowe zasady są opcjonalne."
