  legal:
    label: "Prawne"
    contact_title: "Kontakt"
    support: "Wsparcie"
    support_text: "W sprawach problemów z aplikacją, pytań o konto, problemów z zaproszeniami lub płatnościami skontaktuj się z operatorem aplikacji przez kanał wsparcia podany w Twoim wdrożeniu."
    privacy_requests: "Wnioski prywatności"
    privacy_requests_text: "W przypadku wniosków o dostęp, poprawienie lub usunięcie danych konta podaj adres e-mail powiązany z kontem i krótki opis wniosku."
    helpful_details: "Pomocne szczegóły"
    helpful_details_text: "Zgłaszając błąd, opisz co robiłeś, czy byłeś zalogowany czy grałeś jako gość, typ meczu oraz przeglądarkę/urządzenie, jeśli ma to znaczenie."
    privacy_title: "Polityka prywatności"
    terms_title: "Regulamin"
    privacy:
      overview_title: "1. Przegląd"
      overview_text: "%{app_name} to aplikacja do liczenia punktów i śledzenia meczów darta. Ta strona wyjaśnia, jakie informacje są używane do działania usługi."
      data_title: "2. Dane, które przetwarzamy"
      data_text: "Przetwarzamy dane konta podane przez Ciebie, takie jak adres e-mail i pseudonim, a także dane meczów, nazwy graczy, wyniki, statystyki, ciasteczka sesji oraz informacje techniczne potrzebne do bezpieczeństwa i działania aplikacji."
      why_title: "3. Dlaczego używamy danych"
      why_text: "Dane służą do tworzenia kont, utrzymywania zalogowania, zapisywania meczów, pokazywania statystyk, obsługi zaproszeń, zapobiegania nadużyciom, diagnozowania błędów i poprawy niezawodności."
      cookies_title: "4. Ciasteczka i sesje"
      cookies_text: "Używamy niezbędnych ciasteczek dla sesji logowania, dostępu gości do meczów i preferencji aplikacji, takich jak motyw. Są wymagane do podstawowego działania."
      sharing_title: "5. Udostępnianie i przechowywanie"
      sharing_text: "Dane nie są sprzedawane. Mogą być przetwarzane przez dostawców infrastruktury potrzebnych do hostowania i działania aplikacji. Dane konta i meczów są przechowywane tak długo, jak jest to potrzebne do świadczenia usługi lub do czasu żądania usunięcia, jeśli ma zastosowanie."
      rights_title: "6. Twoje prawa"
      rights_text: "Możesz poprosić o dostęp, poprawienie lub usunięcie danych konta. Niektóre techniczne lub prawne zapisy mogą wymagać zachowania ze względów bezpieczeństwa, zapobiegania oszustwom lub zgodności."
      contact_title: "7. Kontakt"
      contact_text: "W sprawach prywatności lub wniosków dotyczących danych użyj informacji kontaktowych na stronie Kontakt."
    terms:
      service_title: "1. Usługa"
      service_text: "%{app_name} zapewnia liczenie punktów w darcie, historię meczów, statystyki, grę gościnną, konta zarejestrowane oraz powiązane funkcje turniejowe lub zaproszeń."
      accounts_title: "2. Konta"
      accounts_text: "Odpowiadasz za bezpieczeństwo danych logowania i informacje wprowadzone na swoim koncie. Mecze gościnne mogą być przechowywane lokalnie lub przez tokeny dostępu gościa."
      use_title: "3. Dopuszczalne użycie"
      use_text: "Nie nadużywaj aplikacji, nie atakuj ani nie zakłócaj usługi, nie próbuj nieautoryzowanego dostępu, nie przesyłaj złośliwych treści i nie używaj automatycznego scrapingu w sposób szkodzący aplikacji."
      availability_title: "4. Dostępność"
      availability_text: "Aplikacja jest dostarczana taka, jaka jest, i może zmieniać się w czasie. Funkcje mogą być aktualizowane, wstrzymywane lub usuwane w celu poprawy niezawodności, bezpieczeństwa lub użyteczności."
      data_title: "5. Dane użytkownika"
      data_text: "Zachowujesz własność nazw, wyników i danych meczów, które wprowadzasz. Zezwalasz aplikacji na przechowywanie i przetwarzanie tych danych w zakresie potrzebnym do liczenia punktów, historii meczów, zaproszeń i statystyk."
      paid_title: "6. Funkcje płatne"
      paid_text: "Jeśli funkcje płatne są włączone, obowiązują szczegóły planu, ceny i warunki rozliczeń pokazane przy płatności. Darmowe konta pozostają dostępne z zestawem funkcji planu darmowego."
      liability_title: "7. Odpowiedzialność"
      liability_text: "Aplikacja służy do liczenia punktów i wygody. W zakresie dozwolonym przez prawo jest dostarczana bez gwarancji, a odpowiedzialność jest ograniczona do bezpośrednich strat spowodowanych przez usługę."
