      players:
        title: "Dodaj graczy"
        body: "Wpisz nazwy obu graczy. Jeśli ćwiczysz samodzielnie, możesz użyć swojego imienia i nazwy przeciwnika treningowego."
        tip: "Podczas tej prezentacji nazwy graczy są opcjonalne."
      score:
        title: "Wybierz wynik początkowy"
        body: "501 to standardowa gra. Możesz wybrać tutaj inny obsługiwany wynik początkowy."
        tip: "Wynik zmieni się tylko po kliknięciu opcji; przewodnik nie rozpocznie meczu."
