      play:
        title: "Przygotuj swój pierwszy mecz"
        body: "Przejdź przez konfigurację meczu. Dodaj nazwy graczy, wybierz wynik początkowy i poznaj dodatkowe zasady — bez rozpoczynania meczu."
        tip: "Wybierz Graj teraz, aby zobaczyć konfigurację. Przewodnik nie wyśle formularza."
        link: "Graj teraz"
      explore:
        title: "Trenuj i rywalizuj"
        body: "Graj z botami, organizuj turnieje, a zależnie od planu korzystaj z treningów i planów ćwiczeń."
        tip: "Odkrywaj funkcje w nawigacji. Niektóre wymagają konta lub odpowiedniego planu."
        link: "Poznaj grę z botem"
      grow:
        title: "Zachowaj swoje postępy"
        body: "Darmowe konto może zapisywać historię meczów i udostępniać dodatkowe funkcje. Plany Premium i Pro obejmują dostępne narzędzia treningowe i statystyki."
