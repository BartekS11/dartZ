  legal:
    label: "Prawne"
    contact_title: "Kontakt"
    support: "Wsparcie"
    support_text: "W sprawach problemów z aplikacją, pytań o konto, zaproszeń, płatności lub reklamacji skontaktuj się przez support@dartz.pl."
    privacy_requests: "Wnioski prywatności i danych"
    privacy_requests_text: "W sprawach dostępu, poprawienia, usunięcia, ograniczenia, sprzeciwu, przeniesienia danych lub innych wniosków prywatności napisz na support@dartz.pl, najlepiej z adresu e-mail powiązanego z kontem."
    helpful_details: "Pomocne szczegóły"
    helpful_details_text: "Zgłaszając błąd, opisz co robiłeś, czy byłeś zalogowany czy grałeś jako gość, typ meczu oraz przeglądarkę/urządzenie, jeśli ma to znaczenie. Nie wysyłaj haseł ani danych karty płatniczej."
    privacy_title: "Polityka prywatności"
    terms_title: "Regulamin"
    privacy:
      overview_title: "1. Administrator i przegląd"
      overview_text: "%{app_name} to aplikacja do liczenia punktów i śledzenia meczów darta prowadzona przez operatora DartZ. W sprawach prywatności skontaktuj się przez support@dartz.pl. Ta polityka wyjaśnia, jak dane są używane do działania usługi."
      data_title: "2. Dane, które przetwarzamy"
      data_text: "Przetwarzamy dane konta podane przez Ciebie, takie jak adres e-mail i pseudonim, skróty haseł, dane meczów, nazwy graczy, wyniki, statystyki, ciasteczka sesji, tokeny dostępu gościa, preferencje aplikacji, wiadomości do wsparcia oraz informacje techniczne i bezpieczeństwa potrzebne do działania aplikacji."
      why_title: "3. Cele i podstawy prawne"
      why_text: "Dane służą do tworzenia kont, uwierzytelniania użytkowników, liczenia punktów, zapisywania historii meczów, pokazywania statystyk, obsługi znajomych, wyzwań i turniejów, wsparcia, zapobiegania nadużyciom, diagnozowania błędów oraz utrzymania bezpieczeństwa. Zależnie od sytuacji podstawą prawną jest wykonanie umowy, obowiązek prawny, uzasadniony interes lub Twoja zgoda dla funkcji opcjonalnych."
      cookies_title: "4. Ciasteczka i pamięć lokalna"
      cookies_text: "Używamy niezbędnych ciasteczek i podobnych technologii dla sesji logowania, dostępu gości do meczów, bezpieczeństwa oraz preferencji aplikacji, takich jak motyw lub język. W tej konfiguracji DartZ nie używa ciasteczek reklamowych. Jeśli później zostaną dodane narzędzia analityczne lub marketingowe, polityka zostanie zaktualizowana i tam, gdzie wymagane, poprosimy o zgodę."
      sharing_title: "5. Podmioty przetwarzające i udostępnianie"
      sharing_text: "Dane nie są sprzedawane. Dane mogą być przetwarzane przez dostawców usług potrzebnych do działania DartZ, w tym hosting, wysyłkę e-maili, obsługę płatności oraz infrastrukturę techniczną. Dostawcy przetwarzają dane tylko w zakresie potrzebnym do świadczenia usług."
      rights_title: "6. Przechowywanie i Twoje prawa"
      rights_text: "Dane konta i meczów są przechowywane tak długo, jak jest to potrzebne do świadczenia DartZ albo do czasu żądania usunięcia, chyba że zachowanie danych jest wymagane ze względów bezpieczeństwa, zapobiegania nadużyciom, prawnych, podatkowych, księgowych lub sporów. Możesz żądać dostępu, poprawienia, usunięcia, ograniczenia, przeniesienia danych, sprzeciwu lub wycofania zgody. Możesz też złożyć skargę do Prezesa Urzędu Ochrony Danych Osobowych (UODO)."
      friends_title: "7. Znajomi i wyzwania"
      friends_text: "Po włączeniu funkcji przechowujemy Twój kod udostępniania, ustawienia wyszukiwania, zaproszenia, znajomości, blokady i wyzwania meczowe. Blokady są prywatne i widzi je wyłącznie osoba, która je utworzyła. Rozstrzygnięte zaproszenia i wyzwania mogą być zachowane w celu zapobiegania nadużyciom i wsparcia; znajomości i blokady możesz usunąć w każdej chwili."
      push_title: "8. Powiadomienia push przeglądarki"
      push_text: "Powiadomienia push są opcjonalne. Po ich włączeniu przechowujemy zaszyfrowany adres przeglądarki i klucze dostarczania, etykietę urządzenia, ustawienia kategorii oraz ograniczony status dostarczenia. Wysyłamy tylko wybrane kategorie powiadomień. Usunięcie urządzenia zatrzymuje przyszłe wysyłki, a nieprawidłowe subskrypcje są automatycznie unieważniane."
      payments_title: "9. Płatności"
      payments_text: "Jeśli kupisz płatny plan, obsługę płatności i subskrypcji zapewnia Stripe lub inny dostawca pokazany przy płatności. DartZ zapisuje identyfikatory płatności i status subskrypcji, ale nie przechowuje pełnych numerów kart płatniczych. Dokumentacja rozliczeniowa może być przechowywana, gdy wymagają tego przepisy prawa."
      contact_title: "10. Kontakt"
      contact_text: "W sprawach prywatności lub wniosków dotyczących danych skontaktuj się przez support@dartz.pl."
    terms:
      service_title: "1. Usługa"
      service_text: "%{app_name} zapewnia liczenie punktów w darcie, historię meczów, statystyki, grę gościnną, konta zarejestrowane oraz powiązane funkcje turniejów, treningów, znajomych, wyzwań, powiadomień i zaproszeń."
      accounts_title: "2. Konta"
      accounts_text: "Odpowiadasz za bezpieczeństwo danych logowania i informacje wprowadzone na swoim koncie. Mecze gościnne mogą używać pamięci lokalnej, ciasteczek lub tokenów dostępu gościa. Jeśli tworzysz konto lub płatną subskrypcję, podaj prawidłowe dane kontaktowe."
      use_title: "3. Dopuszczalne użycie"
      use_text: "Nie nadużywaj aplikacji, nie atakuj ani nie zakłócaj usługi, nie próbuj nieautoryzowanego dostępu, nie przesyłaj złośliwych treści, nie podszywaj się pod inne osoby, nie naruszaj prywatności innych i nie używaj automatycznego scrapingu w sposób szkodzący DartZ lub innym użytkownikom."
      availability_title: "4. Dostępność"
      availability_text: "DartZ jest dostarczany taki, jaki jest, i może zmieniać się w czasie. Funkcje mogą być aktualizowane, wstrzymywane, ograniczane lub usuwane w celu poprawy niezawodności, bezpieczeństwa lub użyteczności. Staramy się utrzymywać dostępność usługi, ale nie gwarantujemy nieprzerwanego dostępu."
      data_title: "5. Dane użytkownika"
      data_text: "Zachowujesz własność nazw, wyników i danych meczów, które wprowadzasz. Zezwalasz DartZ na przechowywanie i przetwarzanie tych danych w zakresie potrzebnym do liczenia punktów, historii meczów, zaproszeń, statystyk, turniejów, znajomych, wyzwań, powiadomień, wsparcia i bezpieczeństwa."
      paid_title: "6. Funkcje płatne i subskrypcje"
      paid_text: "Szczegóły płatnego planu, ceny, okresy odnowienia i warunki rozliczeń są pokazane przed zakupem. Płatności obsługuje Stripe lub dostawca pokazany przy płatności. Subskrypcjami można zarządzać lub je anulować przez dostępny proces rozliczeniowy. Dostęp do funkcji płatnych może zakończyć się, jeśli płatność nie powiedzie się, subskrypcja zostanie anulowana lub zostanie wykryte nadużycie."
      complaints_title: "7. Kontakt i reklamacje"
      complaints_text: "W sprawach wsparcia, płatności, prywatności lub reklamacji skontaktuj się przez support@dartz.pl. Podaj adres e-mail powiązany z kontem i krótki opis sprawy, abyśmy mogli odpowiedzieć."
      liability_title: "8. Odpowiedzialność"
      liability_text: "DartZ służy do liczenia punktów i wygody. W zakresie dozwolonym przez prawo jest dostarczany bez gwarancji, a odpowiedzialność jest ograniczona do bezpośrednich strat spowodowanych przez usługę. Nic w tym regulaminie nie ogranicza praw, których nie można ograniczyć zgodnie z obowiązującym prawem konsumenckim."
      changes_title: "9. Zmiany i prawo"
      changes_text: "Regulamin może zostać zaktualizowany, gdy zmienia się usługa lub wymagają tego przepisy. Dalsze korzystanie z DartZ po aktualizacji oznacza akceptację zaktualizowanego regulaminu. Dla użytkowników w Polsce zastosowanie mają obowiązkowe przepisy polskiej i unijnej ochrony konsumentów, jeśli mają zastosowanie."
