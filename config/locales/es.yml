  legal:
    label: Información legal
    contact_title: Contacto
    support: Asistencia
    support_text: Si tienes problemas con la aplicación, tu cuenta, las partidas por invitación, la facturación o deseas presentar una reclamación, escribe a support@dartz.pl.
    privacy_requests: Solicitudes de privacidad y datos
    privacy_requests_text: Para solicitar acceso, rectificación, supresión, limitación, oposición, portabilidad u otro ejercicio de tus derechos, escribe a support@dartz.pl, si es posible desde el correo asociado a tu cuenta.
    helpful_details: Información útil
    helpful_details_text: Al informar de un error, indica qué estabas haciendo, si habías iniciado sesión o jugabas como invitado, el tipo de partida y, si procede, tu navegador o dispositivo. No envíes contraseñas ni datos de tarjetas de pago.
    privacy_title: Política de privacidad
    terms_title: Condiciones del servicio
    privacy:
      overview_title: 1. Responsable y resumen
      overview_text: "%{app_name} es una aplicación para puntuar y registrar partidas de dardos, operada por el responsable de DartZ. Para cuestiones de privacidad, contacta con support@dartz.pl. Esta política explica cómo se usan los datos para prestar el servicio."
      data_title: 2. Datos que tratamos
      data_text: Tratamos los datos de cuenta que proporcionas, como el correo electrónico y el apodo; hashes de contraseñas; datos de partidas, nombres de jugadores, puntuaciones y estadísticas; cookies de sesión; tokens de acceso de invitado; preferencias de la aplicación; mensajes de asistencia e información técnica y de seguridad necesaria para mantener la aplicación en funcionamiento.
      why_title: 3. Finalidades y bases jurídicas
      why_text: Usamos los datos para crear cuentas, autenticar usuarios, ofrecer puntuación, guardar el historial y mostrar estadísticas; gestionar amigos, desafíos y torneos; atender consultas; prevenir abusos; resolver errores y mantener la seguridad. Según el caso, la base jurídica es la ejecución de un contrato, una obligación legal, un interés legítimo o tu consentimiento para funciones opcionales.
      cookies_title: 4. Cookies y almacenamiento local
      cookies_text: Usamos cookies esenciales y almacenamiento similar para sesiones de inicio de sesión, acceso de invitados, seguridad y preferencias como el tema o el idioma. En esta configuración, DartZ no utiliza cookies publicitarias. Si añadimos herramientas de análisis o marketing, actualizaremos esta política y solicitaremos consentimiento cuando corresponda.
      sharing_title: 5. Encargados y comunicación de datos
      sharing_text: No vendemos datos. Los proveedores necesarios para operar DartZ, incluidos los de alojamiento, envío de correo, pagos e infraestructura técnica, pueden tratar datos únicamente en la medida necesaria para prestar sus servicios.
      rights_title: 6. Conservación y tus derechos
      rights_text: 'Conservamos los datos de cuenta y partidas mientras sean necesarios para prestar DartZ o hasta que se solicite su eliminación, salvo que deban conservarse por seguridad, prevención del fraude, obligaciones legales, fiscales o contables, o para resolver disputas. Puedes solicitar acceso, rectificación, supresión, limitación, portabilidad, oposición o retirar tu consentimiento. También puedes reclamar ante la autoridad polaca de protección de datos: Prezes Urzędu Ochrony Danych Osobowych (UODO).'
      friends_title: 7. Amigos y desafíos
      friends_text: Si estas funciones están activadas, guardamos tu código para compartir, preferencias de búsqueda, solicitudes y relaciones de amistad, bloqueos y desafíos. Los bloqueos son privados y solo los ve quien los crea. Podemos conservar solicitudes y desafíos resueltos para prevenir abusos y prestar asistencia; puedes eliminar amistades y bloqueos cuando quieras.
      push_title: 8. Notificaciones push del navegador
      push_text: Las notificaciones push son opcionales. Si las activas, guardamos cifrados el endpoint del navegador y las claves de entrega, además de la etiqueta del dispositivo, tus preferencias por categoría y datos limitados de entrega. Solo enviamos las categorías seleccionadas. Al eliminar un dispositivo se detienen futuros envíos; las suscripciones no válidas se revocan automáticamente.
      payments_title: 9. Pagos
      payments_text: Si compras un plan de pago, Stripe u otro proveedor indicado durante el pago gestiona los pagos y la suscripción. DartZ guarda identificadores relacionados con el pago y el estado de la suscripción, pero no almacena números completos de tarjetas. Podemos conservar registros de facturación cuando la ley lo exija.
      contact_title: 10. Contacto
      contact_text: Para consultas de privacidad o solicitudes sobre tus datos, contacta con support@dartz.pl.
    terms:
      service_title: 1. Servicio
      service_text: "%{app_name} ofrece puntuación de dardos, historial de partidas, estadísticas, juego como invitado, cuentas registradas y funciones relacionadas con torneos, entrenamiento, amistades, desafíos, notificaciones e invitaciones."
      accounts_title: 2. Cuentas
      accounts_text: Debes mantener seguras tus credenciales y eres responsable de la información introducida desde tu cuenta. Las partidas de invitado pueden usar almacenamiento local, cookies o tokens de acceso de invitado. Si creas una cuenta o una suscripción de pago, debes proporcionar datos de contacto correctos.
      use_title: 3. Uso aceptable
      use_text: No hagas un uso indebido de la aplicación, ataques o interrumpas el servicio, intentes acceder sin autorización, envíes contenido malicioso, suplantes a otras personas, vulneres su privacidad ni utilices extracción automatizada que perjudique a DartZ o a otros usuarios.
      availability_title: 4. Disponibilidad
      availability_text: DartZ se ofrece tal cual y puede cambiar. Las funciones pueden actualizarse, pausarse, limitarse o retirarse para mejorar la fiabilidad, seguridad o facilidad de uso. Procuramos mantener el servicio disponible, pero no garantizamos el acceso ininterrumpido.
      data_title: 5. Datos del usuario
      data_text: Conservas la propiedad de los nombres, puntuaciones y datos de partidas que introduces. Autorizas a DartZ a almacenarlos y tratarlos cuando sea necesario para ofrecer puntuación, historial, invitaciones, estadísticas, torneos, amistades, desafíos, notificaciones, asistencia y seguridad.
      paid_title: 6. Funciones de pago y suscripciones
      paid_text: Antes de la compra se muestran los detalles, precios, periodos de renovación y condiciones de facturación de los planes de pago. Stripe u otro proveedor indicado en el pago procesa los pagos. Cuando esté disponible, podrás gestionar o cancelar la suscripción desde el flujo de facturación. El acceso a las funciones de pago puede terminar si falla el pago, se cancela la suscripción o se detecta un uso indebido.
      complaints_title: 7. Contacto y reclamaciones
      complaints_text: Para recibir asistencia, consultar sobre pagos, ejercer derechos de privacidad o presentar una reclamación, escribe a support@dartz.pl. Incluye el correo asociado a tu cuenta y una breve descripción del problema para que podamos responderte.
      liability_title: 8. Responsabilidad
      liability_text: DartZ está destinado a llevar puntuaciones y facilitar el juego. En la medida permitida por la ley, se ofrece sin garantías y la responsabilidad se limita a daños directos causados por el servicio. Estas condiciones no limitan derechos que no puedan limitarse conforme a la legislación de consumo aplicable.
      changes_title: 9. Cambios y legislación aplicable
      changes_text: Podemos actualizar estas condiciones cuando cambie el servicio o lo exijan las normas. Si sigues usando DartZ después de una actualización, aceptas las nuevas condiciones. Para usuarios en Polonia se aplican, cuando corresponda, las normas imperativas polacas y de la UE sobre protección de consumidores.
