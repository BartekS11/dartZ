en:
  password_change:
    title: Choose a new password
    hint: You signed in with a temporary password. Choose a different password with at least 12 characters to continue.
    password: New password
    confirmation: Confirm new password
    submit: Save password
    sign_out: Sign out
    invalid: Use a different password with at least 12 characters and matching confirmation (maximum 72 bytes).
pl:
  password_change:
    title: Wybierz nowe hasło
    hint: Używasz hasła tymczasowego. Aby kontynuować, wybierz inne hasło zawierające co najmniej 12 znaków.
    password: Nowe hasło
    confirmation: Potwierdź nowe hasło
    submit: Zapisz hasło
    sign_out: Wyloguj się
    invalid: Wybierz inne hasło zawierające co najmniej 12 znaków i potwierdź je poprawnie (maksymalnie 72 bajty).
nl:
  password_change:
    title: Kies een nieuw wachtwoord
    hint: Je bent ingelogd met een tijdelijk wachtwoord. Kies een ander wachtwoord van minimaal 12 tekens om door te gaan.
    password: Nieuw wachtwoord
    confirmation: Bevestig nieuw wachtwoord
    submit: Wachtwoord opslaan
    sign_out: Uitloggen
    invalid: Gebruik een ander wachtwoord van minimaal 12 tekens met een overeenkomende bevestiging (maximaal 72 bytes).
es:
  password_change:
    title: Elige una nueva contraseña
    hint: Has iniciado sesión con una contraseña temporal. Elige otra contraseña de al menos 12 caracteres para continuar.
    password: Nueva contraseña
    confirmation: Confirma la nueva contraseña
    submit: Guardar contraseña
    sign_out: Cerrar sesión
    invalid: Usa otra contraseña de al menos 12 caracteres y confirma que coincida (máximo 72 bytes).
