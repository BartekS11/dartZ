  legal:
    label: Juridisch
    contact_title: Contact opnemen
    support: Ondersteuning
    support_text: Neem bij problemen met de app, accountvragen, problemen met wedstrijd-uitnodigingen, vragen over betalingen of klachten contact op via support@dartz.pl.
    privacy_requests: Privacy- en gegevensverzoeken
    privacy_requests_text: Stuur verzoeken om inzage, correctie, verwijdering, beperking, bezwaar, overdraagbaarheid of andere privacyverzoeken waar mogelijk vanaf het e-mailadres dat aan je account is gekoppeld naar support@dartz.pl.
    helpful_details: Handige informatie
    helpful_details_text: Vermeld bij een bugmelding wat je deed, of je ingelogd was of als gast speelde, het wedstrijdtype en indien relevant je browser/apparaat. Verstuur geen wachtwoorden of betaalkaartgegevens.
    privacy_title: Privacybeleid
    terms_title: Servicevoorwaarden
    privacy:
      overview_title: 1. Verwerkingsverantwoordelijke en overzicht
      overview_text: "%{app_name} is een app voor dartscores en wedstrijdregistratie, beheerd door de DartZ-exploitant. Neem voor privacyvragen contact op via support@dartz.pl. Dit beleid legt uit hoe gegevens worden gebruikt om de dienst te leveren."
      data_title: 2. Gegevens die we verwerken
      data_text: We verwerken accountgegevens die je verstrekt, zoals e-mailadres en bijnaam, wachtwoordhashes, wedstrijdgegevens, spelersnamen, scores, statistieken, sessiecookies, gasttoegangstokens, appvoorkeuren, supportberichten en technische/beveiligingsgegevens die nodig zijn om de app te laten werken.
      why_title: 3. Doeleinden en rechtsgronden
      why_text: Gegevens worden gebruikt om accounts aan te maken, gebruikers te verifiëren, scores bij te houden, wedstrijdgeschiedenis op te slaan, statistieken te tonen, vrienden, uitdagingen en toernooien te beheren, supportverzoeken af te handelen, misbruik te voorkomen, bugs op te lossen en de beveiliging te waarborgen. Afhankelijk van de situatie is de rechtsgrond uitvoering van een overeenkomst, een wettelijke verplichting, een gerechtvaardigd belang of je toestemming voor optionele functies.
      cookies_title: 4. Cookies en lokale opslag
      cookies_text: We gebruiken essentiële cookies en vergelijkbare opslag voor inlogsessies, toegang tot gastwedstrijden, beveiliging en appvoorkeuren zoals thema of taal. In deze opzet gebruikt DartZ geen advertentiecookies. Als later analyse- of marketingtools worden toegevoegd, wordt dit beleid bijgewerkt en wordt waar nodig toestemming gevraagd.
      sharing_title: 5. Verwerkers en delen
      sharing_text: Gegevens worden niet verkocht. Dienstverleners die nodig zijn voor DartZ, waaronder hosting-, e-mail-, betalings- en technische infrastructuurproviders, kunnen gegevens verwerken. Zij verwerken gegevens alleen voor zover nodig om hun diensten te leveren.
      rights_title: 6. Bewaartermijn en je rechten
      rights_text: 'Account- en wedstrijdgegevens worden bewaard zolang dat nodig is voor DartZ of totdat verwijdering wordt gevraagd, tenzij bewaring nodig is voor beveiliging, fraudepreventie, wettelijke, fiscale of boekhoudkundige verplichtingen of geschillen. Je kunt verzoeken om inzage, correctie, verwijdering, beperking, overdraagbaarheid, bezwaar of intrekking van toestemming. Je kunt ook een klacht indienen bij de Poolse gegevensbeschermingsautoriteit: Prezes Urzędu Ochrony Danych Osobowych (UODO).'
      friends_title: 7. Vrienden en uitdagingen
      friends_text: Als deze functies zijn ingeschakeld, bewaren we je deelcode, vindbaarheidsvoorkeuren, vriendschapsverzoeken, vriendschappen, blokkeringen en wedstrijd-uitdagingen. Blokkeringen zijn privé en alleen zichtbaar voor degene die ze heeft ingesteld. Afgehandelde verzoeken en uitdagingen kunnen worden bewaard om misbruik te voorkomen en support te bieden; vriendschappen en blokkeringen kun je op elk moment verwijderen.
      push_title: 8. Pushmeldingen in de browser
      push_text: Pushmeldingen zijn optioneel. Als je ze inschakelt, bewaren we een versleuteld browserendpoint en bezorgsleutels, het apparaatlabel, categorievoorkeuren en beperkte bezorgstatusgegevens. We versturen alleen de geselecteerde categorieën. Door een apparaat te verwijderen stop je toekomstige bezorging; ongeldige abonnementen worden automatisch ingetrokken.
      payments_title: 9. Betalingen
      payments_text: Bij aankoop van een betaald abonnement worden betalingen en abonnementen afgehandeld door Stripe of een andere betaalprovider die bij het afrekenen wordt vermeld. DartZ bewaart betalingsgerelateerde identificatiegegevens en de abonnementsstatus, maar geen volledige kaartnummers. Factuurgegevens kunnen wettelijk verplicht worden bewaard.
      contact_title: 10. Contact opnemen
      contact_text: Neem voor privacyvragen of gegevensverzoeken contact op via support@dartz.pl.
    terms:
      service_title: 1. Dienst
      service_text: "%{app_name} biedt dartscores, wedstrijdgeschiedenis, statistieken, gastspel, geregistreerde accounts en bijbehorende functies voor toernooien, training, vrienden, uitdagingen, meldingen en uitnodigingen."
      accounts_title: 2. Gebruikersaccounts
      accounts_text: Je bent verantwoordelijk voor het veilig bewaren van je inloggegevens en voor informatie die via je account wordt ingevoerd. Gastwedstrijden kunnen lokale opslag, cookies of gasttoegangstokens gebruiken. Verstrek juiste contactgegevens wanneer je een account of betaald abonnement aanmaakt.
      use_title: 3. Aanvaardbaar gebruik
      use_text: Misbruik de app niet, val de dienst niet aan en verstoor hem niet, probeer geen onbevoegde toegang te krijgen, verstuur geen schadelijke inhoud, doe je niet voor als iemand anders, schend de privacy van anderen niet en gebruik geen geautomatiseerde scraping die DartZ of andere gebruikers schaadt.
      availability_title: 4. Beschikbaarheid
      availability_text: DartZ wordt aangeboden zoals het is en kan veranderen. Functies kunnen worden bijgewerkt, gepauzeerd, beperkt of verwijderd om betrouwbaarheid, beveiliging of gebruiksgemak te verbeteren. We proberen de dienst beschikbaar te houden, maar garanderen geen ononderbroken toegang.
      data_title: 5. Gebruikersgegevens
      data_text: Je blijft eigenaar van de namen, scores en wedstrijdgegevens die je invoert. Je geeft DartZ toestemming deze gegevens op te slaan en te verwerken voor scores, wedstrijdgeschiedenis, uitnodigingen, statistieken, toernooien, vrienden, uitdagingen, meldingen, support en beveiliging.
      paid_title: 6. Betaalde functies en abonnementen
      paid_text: Details, prijzen, verlengingsperioden en betalingsvoorwaarden van betaalde abonnementen worden vóór aankoop getoond. Stripe of de betaalprovider bij het afrekenen verwerkt betalingen. Je kunt abonnementen beheren of opzeggen via de betalingspagina wanneer die beschikbaar is. Toegang tot betaalde functies kan eindigen als een betaling mislukt, een abonnement wordt opgezegd of misbruik wordt vastgesteld.
      complaints_title: 7. Contact en klachten
      complaints_text: Neem voor support, vragen over betalingen, privacyverzoeken of klachten contact op via support@dartz.pl. Vermeld het e-mailadres van je account en een korte beschrijving, zodat we kunnen reageren.
      liability_title: 8. Aansprakelijkheid
      liability_text: DartZ is bedoeld voor scores en gebruiksgemak. Voor zover wettelijk toegestaan wordt de dienst zonder garanties aangeboden en is aansprakelijkheid beperkt tot directe schade die door de dienst is veroorzaakt. Niets in deze voorwaarden beperkt rechten die volgens toepasselijk consumentenrecht niet mogen worden beperkt.
      changes_title: 9. Wijzigingen en toepasselijk recht
      changes_text: Deze voorwaarden kunnen worden bijgewerkt wanneer de dienst verandert of de wet dit vereist. Als je DartZ na een wijziging blijft gebruiken, aanvaard je de bijgewerkte voorwaarden. Voor gebruikers in Polen gelden waar relevant dwingende Poolse en Europese regels voor consumentenbescherming.
