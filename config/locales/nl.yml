  legal:
    label: Legal
    contact_title: Contact
    support: Support
    support_text: For app issues, account questions, invite-match problems, billing questions, or complaints, contact support@dartz.pl.
    privacy_requests: Privacy and data requests
    privacy_requests_text: For access, correction, deletion, restriction, objection, portability, or other privacy requests, email support@dartz.pl from the email address connected to your account when possible.
    helpful_details: Helpful details
    helpful_details_text: When reporting a bug, include what you were doing, whether you were signed in or playing as a guest, the match type, and your browser/device if relevant. Do not send passwords or payment card details.
    privacy_title: Privacy policy
    terms_title: Terms of service
    privacy:
      overview_title: 1. Controller and overview
      overview_text: "%{app_name} is a darts scoring and match tracking app operated by the DartZ operator. For privacy matters, contact support@dartz.pl. This policy explains how data is used to run the service."
      data_title: 2. Data we process
      data_text: We process account details you provide, such as email address and nickname, password hashes, match data, player names, scores, statistics, session cookies, guest access tokens, app preferences, support messages, and technical/security information needed to keep the app working.
      why_title: 3. Purposes and legal bases
      why_text: Data is used to create accounts, authenticate users, provide scoring, save match history, show statistics, handle friends, challenges and tournaments, process support requests, prevent abuse, troubleshoot bugs, and maintain security. Depending on the context, the legal bases are contract performance, legal obligations, legitimate interests, or your consent for optional features.
      cookies_title: 4. Cookies and local storage
      cookies_text: We use essential cookies and similar storage for login sessions, guest match access, security, and app preferences such as theme or language. DartZ does not use advertising cookies in this setup. If analytics or marketing tools are added later, this policy will be updated and consent will be requested where required.
      sharing_title: 5. Processors and sharing
      sharing_text: Data is not sold. Data may be processed by service providers needed to operate DartZ, including hosting, email delivery, payment processing, and technical infrastructure providers. These providers process data only as needed to provide their services.
      rights_title: 6. Retention and your rights
      rights_text: 'Account and match data is kept while needed to provide DartZ or until deletion is requested, unless retention is required for security, fraud prevention, legal, tax, accounting, or dispute reasons. You may request access, correction, deletion, restriction, portability, objection, or withdrawal of consent. You may also complain to the Polish data protection authority: Prezes Urzędu Ochrony Danych Osobowych (UODO).'
      friends_title: 7. Friends and challenges
      friends_text: If enabled, we store your share code, discovery preferences, friend requests, friendships, blocks, and match challenges. Blocks are private and are shown only to the person who created them. Resolved requests and challenges may be retained for abuse prevention and support; you can remove friendships and blocks at any time.
      push_title: 8. Browser push notifications
      push_text: Push notifications are optional. When enabled, we store an encrypted browser endpoint and delivery keys, your device label, category preferences, and limited delivery status. We send only selected notification categories. Removing a device revokes future delivery; invalid subscriptions are revoked automatically.
      payments_title: 9. Payments
      payments_text: If you buy a paid plan, payment and subscription handling is provided by Stripe or another payment provider shown at checkout. DartZ stores payment-related identifiers and subscription status, but does not store full card numbers. Billing records may be retained where required by law.
      contact_title: 10. Contact
      contact_text: For privacy questions or data requests, contact support@dartz.pl.
    terms:
      service_title: 1. Service
      service_text: "%{app_name} provides darts scoring, match history, statistics, guest play, registered accounts, and related tournament, training, friend, challenge, notification, and invite features."
      accounts_title: 2. Accounts
      accounts_text: You are responsible for keeping your login details safe and for information entered under your account. Guest matches may use local storage, cookies, or guest access tokens. You must provide accurate contact information if you create an account or paid subscription.
      use_title: 3. Acceptable use
      use_text: Do not misuse the app, attack or disrupt the service, attempt unauthorized access, submit malicious content, impersonate others, violate others' privacy, or use automated scraping in a way that harms DartZ or other users.
      availability_title: 4. Availability
      availability_text: DartZ is provided as-is and may change over time. Features may be updated, paused, limited, or removed to improve reliability, security, or usability. We try to keep the service available but do not guarantee uninterrupted access.
      data_title: 5. User data
      data_text: You keep ownership of names, scores, and match data you enter. You allow DartZ to store and process that data as needed to provide scoring, match history, invites, statistics, tournaments, friends, challenges, notifications, support, and security.
      paid_title: 6. Paid features and subscriptions
      paid_text: Paid plan details, prices, renewal periods, and billing terms are shown before purchase. Payments are processed by Stripe or the provider shown at checkout. You can manage or cancel subscriptions through the billing flow when available. Access to paid features may end if payment fails, a subscription is cancelled, or abuse is detected.
      complaints_title: 7. Contact and complaints
      complaints_text: For support, billing questions, privacy requests, or complaints, contact support@dartz.pl. Include the email address connected to your account and a short description of the issue so we can respond.
      liability_title: 8. Liability
      liability_text: DartZ is intended for scoring and convenience. To the extent allowed by law, it is provided without warranties and liability is limited to direct losses caused by the service. Nothing in these terms limits rights that cannot be limited under applicable consumer law.
      changes_title: 9. Changes and law
      changes_text: These terms may be updated when the service changes or legal requirements require it. Continued use of DartZ after an update means you accept the updated terms. For users in Poland, mandatory Polish and EU consumer protection rules apply where relevant.
