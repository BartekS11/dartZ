  legal:
    label: "Legal"
    contact_title: "Contact"
    support: "Support"
    support_text: "For app issues, account questions, invite-match problems, or billing questions, contact the app operator through the support channel provided with your deployment."
    privacy_requests: "Privacy requests"
    privacy_requests_text: "For account data access, correction, or deletion requests, include the email address connected to your account and a short description of the request."
