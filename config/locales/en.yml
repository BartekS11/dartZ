    terms_title: "Terms of service"
    privacy:
      overview_title: "1. Overview"
      overview_text: "%{app_name} is a darts scoring and match tracking app. This page explains what information is used to run the service."
      data_title: "2. Data we process"
      data_text: "We process account details you provide, such as email address and nickname, plus match data, player names, scores, statistics, session cookies, and technical information needed to keep the app secure and working."
      why_title: "3. Why we use data"
      why_text: "Data is used to create accounts, keep you signed in, save matches, show statistics, support invite matches, prevent abuse, troubleshoot bugs, and improve reliability."
      cookies_title: "4. Cookies and sessions"
      cookies_text: "We use essential cookies for login sessions, guest match access, and app preferences such as theme mode. These are required for core functionality."
      sharing_title: "5. Sharing and retention"
      sharing_text: "Data is not sold. It may be processed by infrastructure providers required to host and operate the app. Account and match data is kept while needed to provide the service or until deletion is requested where applicable."
      rights_title: "6. Your rights"
      rights_text: "You may request access, correction, or deletion of your account data. Some technical or legal records may need to be retained for security, fraud prevention, or compliance."
      contact_title: "7. Contact"
      contact_text: "For privacy questions or data requests, use the contact information on the Contact page."
    terms:
      service_title: "1. Service"
      service_text: "%{app_name} provides darts scoring, match history, statistics, guest play, registered accounts, and related tournament or invite features."
      accounts_title: "2. Accounts"
      accounts_text: "You are responsible for keeping your login details safe and for the information entered under your account. Guest matches may be stored locally or through guest access tokens."
      use_title: "3. Acceptable use"
      use_text: "Do not misuse the app, attack or disrupt the service, attempt unauthorized access, submit malicious content, or use automated scraping in a way that harms the app."
      availability_title: "4. Availability"
      availability_text: "The app is provided as-is and may change over time. Features may be updated, paused, or removed to improve reliability, security, or usability."
      data_title: "5. User data"
      data_text: "You keep ownership of names, scores, and match data you enter. You allow the app to store and process that data as needed to provide scoring, match history, invites, and statistics."
      paid_title: "6. Paid features"
      paid_text: "If paid features are enabled, plan details, prices, and billing terms shown at checkout apply. Free accounts remain available with the free-tier feature set."
      liability_title: "7. Liability"
      liability_text: "The app is intended for scoring and convenience. To the extent allowed by law, it is provided without warranties and liability is limited to direct losses caused by the service."
